# Common to every environment. Environment-specific settings are in application-dev.yml,
# application-qa.yml and application-prod.yml; with no profile set, dev is used.
spring:
  application:
    name: eureka-discovery-service
  profiles:
    default: dev
  lifecycle:
    # How long in-flight requests get to finish; the container is given longer than this.
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:9111}
  # On stop, finish the requests in flight instead of dropping them.
  shutdown: graceful

eureka:
  client:
    # Standalone registry: it neither registers with nor fetches from a peer.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
